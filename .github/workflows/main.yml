name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4 

      - name: Build da imagem docker
        run: docker build -t livros-api:latest .

      - name: Rodar aplicacao com Compose
        run: docker compose up -d