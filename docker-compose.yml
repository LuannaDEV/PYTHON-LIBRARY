services:
  web:
    image: livros-api:latest
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    volumes:
      - livros_data:/app/data
    networks:
      - livros_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - livros_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  livros_data:
    driver: local

networks:
  livros_net:
    driver: bridge

redis:
  image: redis:7-alpine
  container_name: livros:redis
    - ports:"6379:6379"

celery:
  build: .
  container-name: livros-celery
  command: ["poetry", "run", "celery", "-A", "celery_app:celery_app", "worker", "-Q", "livros", "--loglevel=info"]
  volumes:
    - .:/app
  depends_on:
    - redis
